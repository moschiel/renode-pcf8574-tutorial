<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCF8574 | Renode Lab</title>
<style>
:root{--paper:#f3f1e9;--ink:#1d302b;--muted:#5f7068;--line:#bac9bc;--green:#087b5a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 90% 0%,#dce7d7,transparent 55%),var(--paper);font-family:Consolas,'Liberation Mono',monospace}
main{max-width:1040px;margin:auto;padding:28px}
header,.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:24px}h1{font:normal 30px Georgia,serif;margin:0}
.status,.clock{font-size:12px;color:var(--muted)}.offline{color:#a13924}
.toolbar{margin-bottom:20px}.clock{margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:5px;background:#f9faf5;padding:10px 14px}
button:hover{background:white}button:focus-visible{outline:3px solid #c16a35;outline-offset:4px}button:disabled{opacity:.45;cursor:wait}
.board{padding:28px 24px;border:1px solid var(--line);border-radius:8px;background:radial-gradient(#899c8730 1px,transparent 1px),#ffffff70;background-size:16px 16px}
.chain{display:grid;grid-template-columns:150px 100px 150px minmax(180px,1fr);align-items:center}
.chip{background:var(--ink);color:#f5f2db;border-radius:5px;text-align:center;padding:24px 10px;box-shadow:6px 0 0 -3px #a6b4a1,-6px 0 0 -3px #a6b4a1}
.chip strong{font-size:17px}.chip small{display:block;font-size:11px;color:#b9c9b7;margin-top:8px}
.bus{border-bottom:2px solid var(--green);text-align:center;padding-bottom:8px;font-size:12px}
.pcf{height:100%;display:flex;flex-direction:column;justify-content:center}
.pin-row{display:flex;align-items:center;height:48px}
.wire{flex:1;min-width:32px;border-top:2px solid var(--line);position:relative;margin-right:14px}
.wire span{position:absolute;left:10px;bottom:5px;font-size:11px;color:var(--muted)}
.device{display:flex;align-items:center;gap:12px;width:138px;font-size:12px}
.lamp{height:22px;width:22px;border-radius:50%;background:#aebbaa;border:1px solid #91a08c;box-shadow:inset 0 2px 5px #0002;flex-shrink:0}
.device.on .lamp{background:#d7ff70;box-shadow:0 0 16px #badb58;border-color:#92b448}
.push{padding:8px 10px;text-align:left}
.push::before{content:'';width:12px;height:12px;border:2px solid currentColor;border-radius:3px;flex-shrink:0}
.push[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.push[aria-pressed=true]::before{background:currentColor}
.port{display:flex;justify-content:flex-end;gap:12px;font-size:12px;color:var(--muted);margin:12px 0 20px}.port b{color:var(--ink)}
.terminal{background:#1a2c27;color:#c8e6b5;border-radius:8px;overflow:hidden}
.label{font-size:12px;padding:12px 18px;border-bottom:1px solid #ffffff20;color:#b1c6b5}
.terminal pre{margin:0;padding:16px 18px;min-height:130px;max-height:200px;overflow:auto;font:12px/1.7 Consolas,'Liberation Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#error{display:none;margin:14px 0;padding:12px;background:#f5dcd4;color:#782615;font-size:12px;overflow-wrap:anywhere}.offline-board{opacity:.4}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){
 main{padding:20px 14px}.board{padding:20px 12px}
 .chain{grid-template-columns:110px minmax(140px,1fr);row-gap:24px}
 .chain>.chip:first-child{grid-column:1;grid-row:1}
 .bus{grid-column:1;grid-row:2;height:40px;align-self:stretch;border-bottom:0;border-left:2px solid var(--green);margin-left:54px;padding:10px}
 .pcf{grid-column:1;grid-row:3}.wiring{grid-column:2;grid-row:3}
 .chip strong{font-size:14px}.device{width:110px;font-size:11px}.wire{margin-right:8px;min-width:26px}.wire span{left:5px}
 .clock{margin-left:0;width:100%}.chain{row-gap:0}
}
</style>
<main>
<header><h1>Renode / PCF8574</h1><span class="status" id="status" role="status">Connecting…</span></header>
<div class="toolbar"><button id="pause" disabled>Pause</button><button id="step" disabled>Advance 250 ms</button><span class="clock">VIRTUAL TIME <b id="clock">—</b> s</span></div>
<div id="error" role="alert"></div>
<section class="board" id="board" aria-label="Virtual board">
<div class="chain"><div class="chip"><strong>STM32F407</strong></div><div class="bus">I²C1</div><div class="chip pcf"><strong>PCF8574</strong><small>0x20</small></div><div class="wiring"><div id="leds"></div><div id="buttons"></div></div></div>
</section>
<div class="port mono">Port: <b id="hex">—</b> <span id="bits">—</span></div>
<section class="terminal" aria-label="Firmware UART output"><div class="label">USART2</div><pre id="uart">Waiting for connection…</pre></section>
</main>
<script>
const $=id=>document.getElementById(id);let state=null,busy=false,failed=false;
for(let i=0;i<4;i++){
 const row=pin=>{const r=document.createElement('div');r.className='pin-row';r.innerHTML='<div class="wire"><span>P'+pin+'</span></div>';return r;};
 const el=document.createElement('div');el.className='device';el.id='led'+i;el.innerHTML='<div class="lamp"></div><span>LED '+i+'</span><small class="sr-only">—</small>';const lr=row(i);lr.append(el);$('leds').append(lr);
 const b=document.createElement('button');b.className='push device';b.id='button'+(i+4);b.disabled=true;b.setAttribute('aria-pressed','false');b.title='Click to press or release';b.innerHTML='<span>Button '+(i+4)+'</span><small class="sr-only">—</small>';b.onclick=()=>control({action:'button',pin:i+4,pressed:!state.buttons[i]});const br=row(i+4);br.append(b);$('buttons').append(br);
}
function render(s){state=s;if(s.error)throw Error(s.error);failed=false;$('error').style.display='none';$('board').classList.remove('offline-board');$('status').className='status';$('status').textContent=s.running?'Running':'Paused';$('pause').textContent=s.running?'Pause':'Resume';$('clock').textContent=s.seconds.toFixed(3);$('hex').textContent='0x'+s.port.toString(16).toUpperCase().padStart(2,'0');$('bits').textContent=s.port.toString(2).padStart(8,'0');s.leds.forEach((on,i)=>{const e=$('led'+i);e.classList.toggle('on',on);e.querySelector('small').textContent=on?'ON':'OFF';e.setAttribute('aria-label','LED P'+i+(on?' on':' off'));});s.buttons.forEach((on,i)=>{const b=$('button'+(i+4));b.setAttribute('aria-pressed',String(on));b.querySelector('small').textContent=on?'PRESSED':'RELEASED';});const txt=s.uart.join('\n');if($('uart').textContent!==txt){$('uart').textContent=txt;$('uart').scrollTop=$('uart').scrollHeight;}document.querySelectorAll('button').forEach(b=>b.disabled=busy);}
function offline(e){failed=true;$('status').textContent='Disconnected';$('status').className='status offline';$('error').textContent='Could not update the simulation: '+e.message+'. Check the launcher terminal.';$('error').style.display='block';$('board').classList.add('offline-board');document.querySelectorAll('button').forEach(b=>b.disabled=true);}
async function api(path,options){const r=await fetch(path,{...options,signal:AbortSignal.timeout(8000)});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP failure');return data;}
async function control(body){if(busy||!state)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{render(await api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));}catch(e){offline(e);}finally{busy=false;if(!failed)render(state);}}
$('pause').onclick=()=>control({action:state.running?'pause':'resume'});$('step').onclick=()=>control({action:'step'});
async function poll(){if(!busy){try{const s=await api('/api/state');if(!busy)render(s);}catch(e){offline(e);}}setTimeout(poll,80);}poll();
</script>
</html>
